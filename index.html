<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE FRINGE CUBE 3x3x3 — 3D Tic-Tac-Toe</title>
  <meta name="description"
    content="THE FRINGE CUBE 3x3x3: A cyberpunk neon synthwave 3D tic-tac-toe game with AI opponents, spatial visualization, and synthesized audio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════════
   HYPERGRID // 3X3X3  —  Design System & Global Styles
   ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg-void: #07080d;
      --bg-panel: rgba(10, 12, 22, 0.82);
      --bg-glass: rgba(14, 18, 35, 0.65);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.6);
      --cyan-dim: rgba(0, 240, 255, 0.15);
      --pink: #ff0055;
      --pink-glow: rgba(255, 0, 85, 0.6);
      --pink-dim: rgba(255, 0, 85, 0.15);
      --tri: #00ff88;
      --tri-glow: rgba(0, 255, 136, 0.6);
      --tri-dim: rgba(0, 255, 136, 0.15);
      --violet: #8a2be2;
      --violet-glow: rgba(138, 43, 226, 0.4);
      --text-primary: #e0e6f0;
      --text-dim: #6a7190;
      --border-glow: rgba(0, 240, 255, 0.25);
      --border-dim: rgba(100, 110, 160, 0.15);
      --win-gold: #ffd700;
      --font-display: 'Orbitron', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --radius: 8px;
      --radius-lg: 14px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Hex grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-glow);
      border-radius: 4px;
    }

    /* ── Layout ────────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-rows: 52px 1fr;
      grid-template-columns: 260px 1fr 280px;
      grid-template-areas:
        "topbar topbar topbar"
        "sidebar viewport infobar";
      height: 100%;
      height: 100dvh;
      width: 100vw;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* ── Top Bar ───────────────────────────────────────────────── */
    #topbar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-glow);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan-glow), 0 0 40px rgba(0, 240, 255, 0.3);
      white-space: nowrap;
    }

    .logo span.logo-accent {
      color: var(--violet);
    }

    .topbar-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glow);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: var(--transition);
    }

    .turn-indicator.x-turn {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim);
    }

    .turn-indicator.o-turn {
      border-color: var(--pink);
      color: var(--pink);
      box-shadow: 0 0 15px var(--pink-dim);
    }

    .turn-indicator.tri-turn {
      border-color: var(--tri);
      color: var(--tri);
      box-shadow: 0 0 15px var(--tri-dim);
    }

    .turn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    .x-turn .turn-dot {
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .o-turn .turn-dot {
      background: var(--pink);
      box-shadow: 0 0 8px var(--pink-glow);
    }

    .tri-turn .turn-dot {
      background: var(--tri);
      box-shadow: 0 0 8px var(--tri-glow);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: var(--font-display);
      background: var(--bg-glass);
      border: 1px solid var(--border-dim);
      color: var(--text-dim);
      transition: var(--transition);
    }

    .status-badge.active {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .status-badge.win-x {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
      box-shadow: 0 0 20px var(--cyan-dim);
    }

    .status-badge.win-o {
      border-color: var(--pink);
      color: var(--pink);
      background: var(--pink-dim);
      box-shadow: 0 0 20px var(--pink-dim);
    }

    .status-badge.win-tri {
      border-color: var(--tri);
      color: var(--tri);
      background: var(--tri-dim);
      box-shadow: 0 0 20px var(--tri-dim);
    }

    .status-badge.draw {
      border-color: var(--violet);
      color: var(--violet);
      background: rgba(138, 43, 226, 0.15);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border-glow);
      border-radius: var(--radius);
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.5px;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover {
      background: rgba(0, 240, 255, 0.08);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 16px;
    }

    .btn.active,
    .btn.selected {
      background: var(--cyan-dim);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-dim);
    }

    .btn-pink.active,
    .btn-pink.selected {
      background: var(--pink-dim);
      border-color: var(--pink);
      color: var(--pink);
      box-shadow: 0 0 15px var(--pink-dim);
    }

    .btn-violet {
      border-color: rgba(138, 43, 226, 0.3);
    }

    .btn-violet:hover {
      border-color: var(--violet);
      color: var(--violet);
      background: rgba(138, 43, 226, 0.1);
      box-shadow: 0 0 12px var(--violet-glow);
    }

    /* ── Sidebar (Left) ────────────────────────────────────────── */
    #sidebar {
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-dim);
      backdrop-filter: blur(12px);
      overflow-y: auto;
    }

    .panel {
      background: var(--bg-glass);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 8px;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-title::before {
      content: '◆';
      color: var(--cyan);
      font-size: 7px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .control-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-row .btn {
      flex: 1;
      justify-content: center;
      min-width: 0;
    }

    /* Slider */
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border-dim);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
      cursor: pointer;
    }

    .separator {
      height: 1px;
      background: var(--border-dim);
      margin: 6px 0;
    }

    /* ── Viewport ──────────────────────────────────────────────── */
    #viewport {
      grid-area: viewport;
      position: relative;
      overflow: hidden;
      background: var(--bg-void);
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #flat-view {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 30px;
      background: var(--bg-void);
      overflow: auto;
    }

    #flat-view.active {
      display: flex;
    }

    .flat-plane {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .flat-plane-label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 4px 12px;
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      background: var(--bg-glass);
    }

    .flat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
    }

    .flat-cell {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      background: rgba(7, 8, 13, 0.6);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
    }

    .flat-cell:hover {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.05);
      box-shadow: 0 0 15px var(--cyan-dim);
    }

    .flat-cell.pillar-highlight {
      border-color: rgba(138, 43, 226, 0.5);
      background: rgba(138, 43, 226, 0.08);
    }

    .flat-cell.x-cell {
      color: var(--cyan);
      text-shadow: 0 0 15px var(--cyan-glow);
      border-color: rgba(0, 240, 255, 0.3);
      background: var(--cyan-dim);
    }

    .flat-cell.o-cell {
      color: var(--pink);
      text-shadow: 0 0 15px var(--pink-glow);
      border-color: rgba(255, 0, 85, 0.3);
      background: var(--pink-dim);
    }

    .flat-cell.tri-cell {
      color: var(--tri);
      text-shadow: 0 0 15px var(--tri-glow);
      border-color: rgba(0, 255, 136, 0.3);
      background: var(--tri-dim);
    }

    .flat-cell.ghost-x {
      color: rgba(0, 240, 255, 0.25);
    }

    .flat-cell.ghost-o {
      color: rgba(255, 0, 85, 0.25);
    }

    .flat-cell.ghost-tri {
      color: rgba(0, 255, 136, 0.25);
    }

    .flat-cell.winning-cell {
      animation: win-pulse 0.8s ease-in-out infinite alternate;
    }

    .flat-cell.winning-cell.x-cell {
      box-shadow: 0 0 20px var(--cyan-glow), 0 0 40px var(--cyan-dim);
    }

    .flat-cell.winning-cell.o-cell {
      box-shadow: 0 0 20px var(--pink-glow), 0 0 40px var(--pink-dim);
    }

    .flat-cell.winning-cell.tri-cell {
      box-shadow: 0 0 20px var(--tri-glow), 0 0 40px var(--tri-dim);
    }

    .flat-cell.dimmed {
      opacity: 0.25;
    }

    @keyframes win-pulse {
      from {
        transform: scale(1);
        filter: brightness(1);
      }

      to {
        transform: scale(1.06);
        filter: brightness(1.4);
      }
    }

    /* ── Info Bar (Right) ──────────────────────────────────────── */
    #infobar {
      grid-area: infobar;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-dim);
      backdrop-filter: blur(12px);
      overflow-y: auto;
    }

    .score-display {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .score-card {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      border: 1px solid var(--border-dim);
      transition: var(--transition);
    }

    .score-card.x-score {
      border-color: rgba(0, 240, 255, 0.2);
    }

    .score-card.o-score {
      border-color: rgba(255, 0, 85, 0.2);
    }

    .score-card.tri-score {
      border-color: rgba(0, 255, 136, 0.2);
    }

    .score-card.draw-score {
      border-color: rgba(138, 43, 226, 0.2);
    }

    .score-card .label {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .score-card.x-score .label {
      color: var(--cyan);
    }

    .score-card.o-score .label {
      color: var(--pink);
    }

    .score-card.tri-score .label {
      color: var(--tri);
    }

    .score-card.draw-score .label {
      color: var(--violet);
    }

    .score-card .value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
    }

    .score-card.x-score .value {
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .score-card.o-score .value {
      color: var(--pink);
      text-shadow: 0 0 10px var(--pink-glow);
    }

    .score-card.tri-score .value {
      color: var(--tri);
      text-shadow: 0 0 10px var(--tri-glow);
    }

    .score-card.draw-score .value {
      color: var(--violet);
      text-shadow: 0 0 10px var(--violet-glow);
    }

    .move-counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-radius: var(--radius);
      background: var(--bg-glass);
      border: 1px solid var(--border-dim);
      font-size: 11px;
      color: var(--text-dim);
    }

    .move-counter .count {
      color: var(--text-primary);
      font-weight: 600;
      font-family: var(--font-display);
    }

    .history-log {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      max-height: 300px;
      padding-right: 4px;
    }

    .history-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius);
      background: rgba(7, 8, 13, 0.4);
      border: 1px solid transparent;
      font-size: 11px;
      animation: slide-in 0.2s ease-out;
    }

    .history-entry.x-move {
      border-left: 2px solid var(--cyan);
    }

    .history-entry.o-move {
      border-left: 2px solid var(--pink);
    }

    .history-entry.tri-move {
      border-left: 2px solid var(--tri);
    }

    .history-entry .move-num {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dim);
      min-width: 20px;
    }

    .history-entry .move-player {
      font-weight: 700;
      font-size: 12px;
    }

    .history-entry.x-move .move-player {
      color: var(--cyan);
    }

    .history-entry.o-move .move-player {
      color: var(--pink);
    }

    .history-entry.tri-move .move-player {
      color: var(--tri);
    }

    .history-entry .move-pos {
      color: var(--text-dim);
      font-size: 10px;
      margin-left: auto;
      font-family: var(--font-mono);
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateX(10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ── Winning Lines Checklist ──────────────────────────────── */
    .lines-checklist {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      max-height: 200px;
      overflow-y: auto;
    }

    .line-item {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 9px;
      color: var(--text-dim);
      background: rgba(7, 8, 13, 0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: var(--transition);
    }

    .line-item.x-won {
      color: var(--cyan);
      background: var(--cyan-dim);
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .line-item.o-won {
      color: var(--pink);
      background: var(--pink-dim);
      border: 1px solid rgba(255, 0, 85, 0.2);
    }

    .line-item.tri-won {
      color: var(--tri);
      background: var(--tri-dim);
      border: 1px solid rgba(0, 255, 136, 0.2);
    }

    /* ── Ambient Particles (CSS) ──────────────────────────────── */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: var(--cyan);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 0;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        opacity: 0;
        transform: translateY(100vh) translateX(0);
      }

      10% {
        opacity: 0.6;
      }

      90% {
        opacity: 0.6;
      }

      100% {
        opacity: 0;
        transform: translateY(-10vh) translateX(40px);
      }
    }

    /* ── Responsive & Mobile Design System ─────────────────────── */
    .logo-short {
      display: none;
    }

    .btn-reset .reset-icon {
      display: none;
    }

    .mobile-score-ribbon {
      display: none;
      grid-area: mobileribbon;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: rgba(10, 12, 22, 0.94);
      border-bottom: 1px solid var(--border-dim);
      backdrop-filter: blur(12px);
      z-index: 90;
      gap: 10px;
    }

    .mob-scores {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mob-scores::-webkit-scrollbar {
      display: none;
    }

    .mob-score {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-glass);
      border: 1px solid var(--border-dim);
      white-space: nowrap;
    }

    .mob-score .sym {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
    }

    .mob-score.mob-x {
      border-color: rgba(0, 240, 255, 0.25);
      color: var(--cyan);
    }

    .mob-score.mob-o {
      border-color: rgba(255, 0, 85, 0.25);
      color: var(--pink);
    }

    .mob-score.mob-tri {
      border-color: rgba(0, 255, 136, 0.25);
      color: var(--tri);
    }

    .mob-score.mob-draw {
      border-color: rgba(138, 43, 226, 0.25);
      color: #a4b3d6;
    }

    .mob-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mob-action-btn {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-primary);
      background: var(--bg-glass);
      border: 1px solid var(--border-glow);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
    }

    .mob-action-btn:hover,
    .mob-action-btn:active {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.12);
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    .flat-planes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
    }

    /* Floating 3D Mobile Dock */
    .mobile-3d-dock {
      display: none;
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), 0 0 15px var(--cyan-dim);
      z-index: 25;
      pointer-events: auto;
      max-width: 96vw;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dock-divider {
      width: 1px;
      height: 18px;
      background: var(--border-glow);
      margin: 0 3px;
    }

    .dock-btn {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 4px 8px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .dock-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-dim);
    }

    .dock-btn.active {
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-dim);
    }

    /* Mobile Telemetry & Stats Modal */
    .stats-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 10, 0.75);
      backdrop-filter: blur(8px);
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .stats-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .stats-modal-dialog {
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px var(--cyan-dim);
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stats-modal.open .stats-modal-dialog {
      transform: translateY(0) scale(1);
    }

    .stats-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-dim);
      background: var(--bg-glass);
    }

    .stats-modal-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    .stats-modal-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .stats-modal-close:hover {
      color: var(--pink);
    }

    .stats-modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-dim);
      background: rgba(14, 18, 35, 0.4);
    }

    .stats-tab-btn {
      flex: 1;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 8px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
    }

    .stats-tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
      background: rgba(0, 240, 255, 0.05);
    }

    .stats-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      min-height: 200px;
    }

    .modal-tab-content {
      display: none;
    }

    .modal-tab-content.active {
      display: block;
    }

    /* Media query for screens <= 1100px */
    @media (max-width: 1100px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 50px auto 1fr;
        grid-template-areas:
          "topbar"
          "mobileribbon"
          "viewport";
      }

      #infobar {
        display: none;
      }

      .mobile-score-ribbon {
        display: flex;
      }

      .mobile-3d-dock.visible {
        display: flex;
      }

      #flat-view {
        padding: 8px 6px;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }

      .flat-planes-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        align-items: center;
        justify-content: center;
      }

      .flat-planes-container .flat-plane {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .flat-planes-container .flat-plane-label {
        font-size: 8px;
        padding: 2px 8px;
        letter-spacing: 1px;
      }

      .flat-planes-container .flat-grid {
        gap: 3px;
        padding: 4px;
      }

      .flat-planes-container .flat-cell {
        width: clamp(35px, 9vw, 46px);
        height: clamp(35px, 9vw, 46px);
        font-size: clamp(16px, 4.4vw, 24px);
        border-radius: 6px;
      }
    }

    /* Compact screens <= 600px */
    @media (max-width: 600px) {
      #topbar {
        padding: 0 10px;
      }

      .logo-full {
        display: none;
      }

      .logo-short {
        display: inline;
      }

      .logo {
        font-size: 13px;
        letter-spacing: 2px;
      }

      .topbar-center {
        gap: 8px;
      }

      .turn-indicator {
        padding: 4px 8px;
        font-size: 9px;
        gap: 5px;
      }

      .turn-dot {
        width: 6px;
        height: 6px;
      }

      .btn-reset .reset-text {
        display: none;
      }

      .btn-reset .reset-icon {
        display: inline;
        font-size: 14px;
        font-weight: 700;
      }

      .btn-reset {
        padding: 4px 8px;
        min-width: 32px;
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .topbar-right {
        gap: 6px;
      }
    }

    /* Extra compact phones <= 420px */
    @media (max-width: 420px) {
      #statusBadge {
        display: none;
      }

      .turn-indicator {
        padding: 3px 6px;
        font-size: 8.5px;
      }

      .mob-score {
        padding: 2px 5px;
        font-size: 10px;
      }

      .mob-action-btn {
        padding: 3px 7px;
        font-size: 9px;
      }
    }

    /* Mobile landscape orientation */
    @media (max-height: 540px) and (orientation: landscape) {
      #mobileScoreRibbon {
        padding: 2px 10px;
      }

      #flat-view {
        padding: 4px;
        gap: 4px;
      }

      .flat-planes-container {
        flex-direction: row !important;
        gap: 10px !important;
        justify-content: center !important;
        align-items: center !important;
      }

      .flat-plane {
        display: flex !important;
        gap: 4px !important;
      }

      .flat-cell {
        width: clamp(38px, 17vh, 56px) !important;
        height: clamp(38px, 17vh, 56px) !important;
        font-size: clamp(16px, 7vh, 24px) !important;
      }

      .flat-plane-label {
        font-size: 7.5px !important;
        padding: 2px 6px !important;
      }
    }

    /* ── Viewport mode indicator ─────────────────────────────── */
    .view-mode-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--violet);
      background: var(--bg-glass);
      border: 1px solid rgba(138, 43, 226, 0.3);
      backdrop-filter: blur(8px);
      z-index: 10;
      pointer-events: none;
    }

    /* ── Hamburger Menu ──────────────────────────────────────── */
    .hamburger-btn {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--border-glow);
      border-radius: var(--radius);
      background: var(--bg-glass);
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .hamburger-btn:hover {
      background: rgba(0, 240, 255, 0.08);
      border-color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    .hamburger-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--cyan);
      border-radius: 1px;
      transition: var(--transition);
    }

    .hamburger-btn.open span:nth-child(1) {
      transform: rotate(45deg) translate(4px, 4px);
    }

    .hamburger-btn.open span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .hamburger-btn.open span:nth-child(3) {
      transform: rotate(-45deg) translate(4px, -4px);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 199;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.visible {
      opacity: 1;
    }

    @media (max-width: 1100px) {
      .hamburger-btn {
        display: flex;
      }

      #sidebar {
        position: fixed;
        top: 50px;
        left: 0;
        bottom: 0;
        width: min(300px, 86vw);
        z-index: 200;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        border-right: 1px solid var(--border-glow);
        border-top: none;
        padding: 12px;
        gap: 2px;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: var(--bg-panel);
        backdrop-filter: blur(16px);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar .panel {
        min-width: unset;
        margin-bottom: 8px;
      }

      .sidebar-overlay.open {
        display: block;
      }
    }
  </style>
</head>

<body>

  <!-- Ambient particles -->
  <div id="particles"></div>

  <div id="app">
    <!-- ═══ Top Bar ═══ -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <header id="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebar()" title="Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="logo">
          <span class="logo-full">THE FRINGE CUBE <span class="logo-accent">3x3x3</span></span>
          <span class="logo-short">FRINGE <span class="logo-accent">3³</span></span>
        </div>
      </div>
      <div class="topbar-center">
        <div id="turnIndicator" class="turn-indicator x-turn">
          <div class="turn-dot"></div>
          <span id="turnText">PLAYER X</span>
        </div>
        <div id="statusBadge" class="status-badge active">ACTIVE</div>
      </div>
      <div class="topbar-right">
        <button id="btnAudio" class="btn btn-icon" title="Toggle Audio" onclick="toggleAudio()">🔊</button>
        <button class="btn btn-reset" onclick="resetGame()" title="Reset Game">
          <span class="reset-text">⟳ RESET</span>
          <span class="reset-icon">⟳</span>
        </button>
      </div>
    </header>

    <!-- ═══ Mobile Quick Score Ribbon ═══ -->
    <div id="mobileScoreRibbon" class="mobile-score-ribbon">
      <div class="mob-scores">
        <div class="mob-score mob-x"><span class="sym">✕</span> <span id="mobScoreX">0</span></div>
        <div class="mob-score mob-o"><span class="sym">◯</span> <span id="mobScoreO">0</span></div>
        <div class="mob-score mob-tri" id="mobScoreTriWrap" style="display:none;"><span class="sym">△</span> <span
            id="mobScoreTri">0</span></div>
        <div class="mob-score mob-draw"><span class="sym">D</span> <span id="mobScoreDraw">0</span></div>
      </div>
      <div class="mob-actions">
        <button id="mobBtnViewToggle" class="mob-action-btn" onclick="toggleViewModeMobile()" title="Switch 2D / 3D">
          <span id="mobBtnViewIcon">◈ 3D</span>
        </button>
        <button id="mobBtnStats" class="mob-action-btn" onclick="openStatsModal()" title="View Stats & Move Log">
          📜 LOG
        </button>
      </div>
    </div>

    <!-- ═══ Left Sidebar ═══ -->
    <aside id="sidebar">
      <!-- View Mode -->
      <div class="panel">
        <div class="panel-title">View Mode</div>
        <div class="btn-row">
          <button id="btnView3D" class="btn" onclick="setViewMode('3d')">◈ 3D SPATIAL</button>
          <button id="btnView2D" class="btn active" onclick="setViewMode('2d')">▦ 2D PLANES</button>
        </div>
      </div>

      <!-- Game Mode -->
      <div class="panel">
        <div class="panel-title">Game Mode</div>
        <div class="btn-row">
          <button id="btnPvP" class="btn active" onclick="setGameMode('pvp')" title="2 Players (X vs O)">⚔ 2P</button>
          <button id="btn3P" class="btn" onclick="setGameMode('3p')" title="3 Players (X vs O vs △)">▲ 3P</button>
          <button id="btnPvAI" class="btn" onclick="setGameMode('ai')" title="Single Player vs AI">🤖 vs AI</button>
        </div>
        <div id="threePlayerSettings" style="display:none; margin-top:10px;">
          <div class="control-label" style="margin-bottom:6px;">3P Participants</div>
          <div class="btn-row">
            <button id="btn3pHumans" class="btn active" onclick="set3PBotMode('0')" title="3 Human Players">3
              HUMANS</button>
            <button id="btn3p1Bot" class="btn" onclick="set3PBotMode('1')" title="2 Humans + 1 Bot">+1 BOT</button>
            <button id="btn3p2Bots" class="btn" onclick="set3PBotMode('2')" title="1 Human + 2 Bots">+2 BOTS</button>
          </div>
        </div>
        <div id="aiSettings" style="display:none; margin-top:10px;">
          <div class="control-label" style="margin-bottom:6px;">AI Difficulty</div>
          <div class="btn-row">
            <button id="btnEasy" class="btn active" onclick="setDifficulty('easy')">NOVICE</button>
            <button id="btnMed" class="btn" onclick="setDifficulty('medium')">TACTICAL</button>
            <button id="btnHard" class="btn" onclick="setDifficulty('hard')">CYBER</button>
          </div>
        </div>
      </div>

      <!-- 3D Controls -->
      <div class="panel" id="panel3DControls">
        <div class="panel-title">3D Controls</div>
        <div class="control-group">
          <div class="control-label">Explode Layers</div>
          <div class="slider-container">
            <input type="range" id="explodeSlider" min="0" max="100" value="30" oninput="setExplode(this.value)">
          </div>
        </div>
        <div class="separator"></div>
        <div class="control-label" style="margin-bottom:6px;">Camera Presets</div>
        <div class="btn-row">
          <button class="btn" onclick="setCameraPreset('front')">FRONT</button>
          <button class="btn" onclick="setCameraPreset('top')">TOP</button>
          <button class="btn" onclick="setCameraPreset('iso')">ISO</button>
        </div>
        <div class="separator"></div>
        <div class="control-label" style="margin-bottom:6px;">Isolate Layer</div>
        <div class="btn-row">
          <button id="btnL0" class="btn" onclick="isolateLayer(0)">L1</button>
          <button id="btnL1" class="btn" onclick="isolateLayer(1)">L2</button>
          <button id="btnL2" class="btn" onclick="isolateLayer(2)">L3</button>
          <button id="btnLAll" class="btn active" onclick="isolateLayer(-1)">ALL</button>
        </div>
      </div>
    </aside>

    <!-- ═══ Viewport ═══ -->
    <main id="viewport">
      <div id="viewModeBadge" class="view-mode-badge">3D SPATIAL</div>
      <canvas id="three-canvas"></canvas>
      <div id="flat-view">
        <!-- Dynamically generated with layer switcher and planes -->
      </div>

      <!-- Floating 3D Mobile Dock -->
      <div id="mobile3DDock" class="mobile-3d-dock">
        <div class="dock-group">
          <button class="dock-btn" onclick="setCameraPreset('front')">FRONT</button>
          <button class="dock-btn" onclick="setCameraPreset('top')">TOP</button>
          <button class="dock-btn" onclick="setCameraPreset('iso')">ISO</button>
        </div>
        <div class="dock-divider"></div>
        <div class="dock-group">
          <button class="dock-btn dock-layer-btn active" id="mobLAll" onclick="isolateLayer(-1)">ALL</button>
          <button class="dock-btn dock-layer-btn" id="mobL0" onclick="isolateLayer(0)">L1</button>
          <button class="dock-btn dock-layer-btn" id="mobL1" onclick="isolateLayer(1)">L2</button>
          <button class="dock-btn dock-layer-btn" id="mobL2" onclick="isolateLayer(2)">L3</button>
        </div>
      </div>
    </main>

    <!-- ═══ Right Info Bar ═══ -->
    <aside id="infobar">
      <div class="panel">
        <div class="panel-title">Scoreboard</div>
        <div class="score-display">
          <div class="score-card x-score" id="scoreCardX">
            <div class="label">✕</div>
            <div class="value" id="scoreX">0</div>
          </div>
          <div class="score-card o-score" id="scoreCardO">
            <div class="label">◯</div>
            <div class="value" id="scoreO">0</div>
          </div>
          <div class="score-card tri-score" id="scoreCardTri" style="display:none;">
            <div class="label">△</div>
            <div class="value" id="scoreTri">0</div>
          </div>
          <div class="score-card draw-score" id="scoreCardDraw">
            <div class="label">DRAW</div>
            <div class="value" id="scoreDraw">0</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Move Log</div>
        <div class="move-counter">
          <span>Total Moves</span>
          <span class="count" id="moveCount">0 / 27</span>
        </div>
        <div style="height:8px;"></div>
        <div class="history-log" id="historyLog">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Win Lines (49)</div>
        <div class="lines-checklist" id="linesChecklist">
          <!-- Dynamically populated -->
        </div>
      </div>
    </aside>
  </div>

  <!-- ═══ Mobile Stats & History Modal ═══ -->
  <div id="statsModal" class="stats-modal" onclick="onStatsModalClick(event)">
    <div class="stats-modal-dialog">
      <div class="stats-modal-header">
        <div class="stats-modal-title">GAME TELEMETRY</div>
        <button class="stats-modal-close" onclick="closeStatsModal()" title="Close">✕</button>
      </div>
      <div class="stats-modal-tabs">
        <button id="modalTabMoves" class="stats-tab-btn active" onclick="switchModalTab('moves')">MOVE LOG (<span
            id="modalMoveCount">0/27</span>)</button>
        <button id="modalTabLines" class="stats-tab-btn" onclick="switchModalTab('lines')">WIN LINES (49)</button>
      </div>
      <div class="stats-modal-body">
        <div id="modalMoveLogView" class="modal-tab-content active">
          <div class="history-log" id="modalHistoryLog"></div>
        </div>
        <div id="modalLinesView" class="modal-tab-content">
          <div class="lines-checklist" id="modalLinesChecklist"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // HYPERGRID // 3X3X3  —  Game Engine
    // ═══════════════════════════════════════════════════════════════

    // ── Constants ─────────────────────────────────────────────────
    const EMPTY = 0, X = 1, O = 2, TRIANGLE = 3;
    const CYAN = 0x00f0ff, PINK = 0xff0055, TRI_COLOR = 0x00ff88, VIOLET = 0x8a2be2;

    // ── Game State ────────────────────────────────────────────────
    let board = new Array(27).fill(EMPTY);
    let currentPlayer = X;
    let gameOver = false;
    let winLine = null;
    let viewMode = '2d'; // '3d' or '2d'
    let gameMode = 'pvp'; // 'pvp' (2P), '3p' (3P), or 'ai'
    let botMode3P = '0'; // '0': 3 humans, '1': 1 bot (triangle), '2': 2 bots (o & triangle)
    let aiDifficulty = 'easy';
    let audioEnabled = true;
    let moveHistory = [];
    let scores = { x: 0, o: 0, tri: 0, draw: 0 };
    let isolatedLayer = -1;
    let explodeAmount = 0.3;

    function getPlayerColorHex(player) {
      if (player === X) return CYAN;
      if (player === O) return PINK;
      if (player === TRIANGLE) return TRI_COLOR;
      return 0x2a3055;
    }

    function getPlayerSymbol(player) {
      if (player === X) return '✕';
      if (player === O) return '◯';
      if (player === TRIANGLE) return '△';
      return '';
    }

    function isCurrentPlayerBot() {
      if (gameMode === 'ai') return currentPlayer === O;
      if (gameMode === '3p') {
        if (botMode3P === '1') return currentPlayer === TRIANGLE;
        if (botMode3P === '2') return currentPlayer === O || currentPlayer === TRIANGLE;
      }
      return false;
    }

    // ── 49 Winning Lines ─────────────────────────────────────────
    // index = y*9 + z*3 + x  (layer=y, row=z, col=x)
    function idx(x, y, z) { return y * 9 + z * 3 + x; }

    const WIN_LINES = [];
    const WIN_LINE_LABELS = [];

    // Helper to add a line
    function addLine(cells, label) {
      WIN_LINES.push(cells);
      WIN_LINE_LABELS.push(label);
    }

    // 9 rows per axis direction × 3 axes = 27 axial lines
    // X-axis rows (along x for fixed y,z)
    for (let y = 0; y < 3; y++)
      for (let z = 0; z < 3; z++)
        addLine([idx(0, y, z), idx(1, y, z), idx(2, y, z)], `X-Row L${y + 1} R${z + 1}`);

    // Y-axis columns (along y for fixed x,z)
    for (let x = 0; x < 3; x++)
      for (let z = 0; z < 3; z++)
        addLine([idx(x, 0, z), idx(x, 1, z), idx(x, 2, z)], `Y-Col C${x + 1} R${z + 1}`);

    // Z-axis columns (along z for fixed x,y)
    for (let x = 0; x < 3; x++)
      for (let y = 0; y < 3; y++)
        addLine([idx(x, y, 0), idx(x, y, 1), idx(x, y, 2)], `Z-Col C${x + 1} L${y + 1}`);

    // 18 planar diagonals (2 diagonals × 3 slices × 3 planes)
    // XY plane diagonals (fixed z)
    for (let z = 0; z < 3; z++) {
      addLine([idx(0, 0, z), idx(1, 1, z), idx(2, 2, z)], `XY-Diag R${z + 1} ↘`);
      addLine([idx(2, 0, z), idx(1, 1, z), idx(0, 2, z)], `XY-Diag R${z + 1} ↙`);
    }
    // XZ plane diagonals (fixed y)
    for (let y = 0; y < 3; y++) {
      addLine([idx(0, y, 0), idx(1, y, 1), idx(2, y, 2)], `XZ-Diag L${y + 1} ↘`);
      addLine([idx(2, y, 0), idx(1, y, 1), idx(0, y, 2)], `XZ-Diag L${y + 1} ↙`);
    }
    // YZ plane diagonals (fixed x)
    for (let x = 0; x < 3; x++) {
      addLine([idx(x, 0, 0), idx(x, 1, 1), idx(x, 2, 2)], `YZ-Diag C${x + 1} ↘`);
      addLine([idx(x, 2, 0), idx(x, 1, 1), idx(x, 0, 2)], `YZ-Diag C${x + 1} ↙`);
    }

    // 4 space diagonals
    addLine([idx(0, 0, 0), idx(1, 1, 1), idx(2, 2, 2)], 'Space Diag 1');
    addLine([idx(2, 0, 0), idx(1, 1, 1), idx(0, 2, 2)], 'Space Diag 2');
    addLine([idx(0, 0, 2), idx(1, 1, 1), idx(2, 2, 0)], 'Space Diag 3');
    addLine([idx(2, 0, 2), idx(1, 1, 1), idx(0, 2, 0)], 'Space Diag 4');

    // ── Coordinate helpers ───────────────────────────────────────
    function idxToCoord(i) {
      const y = Math.floor(i / 9);
      const z = Math.floor((i % 9) / 3);
      const x = i % 3;
      return { x, y, z };
    }

    function coordLabel(i) {
      const c = idxToCoord(i);
      return `L${c.y + 1}(${c.x},${c.z})`;
    }

    // ── Win Detection ────────────────────────────────────────────
    function checkWin(b) {
      for (let i = 0; i < WIN_LINES.length; i++) {
        const [a, bb, c] = WIN_LINES[i];
        if (b[a] !== EMPTY && b[a] === b[bb] && b[bb] === b[c]) {
          return { winner: b[a], line: WIN_LINES[i], lineIndex: i };
        }
      }
      return null;
    }

    function isBoardFull(b) {
      return b.every(c => c !== EMPTY);
    }

    // ═══════════════════════════════════════════════════════════════
    // Three.js — 3D Viewport
    // ═══════════════════════════════════════════════════════════════

    let scene, camera, renderer, controls;
    let cellMeshes = [];
    let glyphMeshes = [];
    let ghostMesh = null;
    let winLineMesh = null;
    let hoveredCell = -1;
    let animFrame;

    function init3D() {
      const canvas = document.getElementById('three-canvas');
      const rect = document.getElementById('viewport').getBoundingClientRect();

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x07080d, 0.04);

      camera = new THREE.PerspectiveCamera(50, rect.width / rect.height, 0.1, 1000);
      camera.position.set(6, 5, 8);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(rect.width, rect.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x07080d, 1);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 5;
      controls.maxDistance = 25;
      controls.target.set(0, 0, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x334466, 0.5);
      scene.add(ambientLight);

      const pointLight1 = new THREE.PointLight(CYAN, 0.8, 30);
      pointLight1.position.set(5, 8, 5);
      scene.add(pointLight1);

      const pointLight2 = new THREE.PointLight(PINK, 0.5, 30);
      pointLight2.position.set(-5, -3, -5);
      scene.add(pointLight2);

      // Grid helper lines (subtle)
      const gridSize = 4;
      const gridMat = new THREE.LineBasicMaterial({ color: 0x1a1f3a, transparent: true, opacity: 0.3 });
      for (let i = -gridSize; i <= gridSize; i++) {
        const geo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(i, -0.01, -gridSize),
          new THREE.Vector3(i, -0.01, gridSize)
        ]);
        scene.add(new THREE.Line(geo, gridMat));
        const geo2 = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-gridSize, -0.01, i),
          new THREE.Vector3(gridSize, -0.01, i)
        ]);
        scene.add(new THREE.Line(geo2, gridMat));
      }

      buildCells();

      // Raycasting & Pointer/Touch Interaction
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let pointerDownPos = { x: 0, y: 0, time: 0 };

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;

        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects(cellMeshes.filter(m => m.visible));
        const prevHovered = hoveredCell;
        hoveredCell = -1;
        if (intersects.length > 0) {
          const mesh = intersects[0].object;
          const ci = mesh.userData.cellIndex;
          if (board[ci] === EMPTY && !gameOver) {
            hoveredCell = ci;
            document.body.style.cursor = 'pointer';
          }
        }
        if (hoveredCell === -1) document.body.style.cursor = 'default';
        if (hoveredCell !== prevHovered) {
          updateGhostPreview();
          updateCellHighlights();
          if (hoveredCell !== -1) playSound('hover');
        }
      });

      canvas.addEventListener('pointerleave', () => {
        if (hoveredCell !== -1) {
          hoveredCell = -1;
          updateGhostPreview();
          updateCellHighlights();
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownPos.time = Date.now();
      });

      canvas.addEventListener('pointerup', (e) => {
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.hypot(dx, dy);
        const dt = Date.now() - pointerDownPos.time;

        if (dist > 12 || dt > 450) return;

        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects(cellMeshes.filter(m => m.visible));
        if (intersects.length > 0) {
          const mesh = intersects[0].object;
          const ci = mesh.userData.cellIndex;
          if (board[ci] === EMPTY && !gameOver && !isCurrentPlayerBot()) {
            makeMove(ci);
          }
        }
      });

      window.addEventListener('resize', onResize);
      animate();
    }

    function buildCells() {
      // Clear existing
      cellMeshes.forEach(m => scene.remove(m));
      glyphMeshes.forEach(m => scene.remove(m));
      cellMeshes = [];
      glyphMeshes = [];
      if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
      if (winLineMesh) { scene.remove(winLineMesh); winLineMesh = null; }

      const spacing = 1.6;
      const cellGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
      const edgeGeo = new THREE.EdgesGeometry(cellGeo);

      for (let i = 0; i < 27; i++) {
        const { x, y, z } = idxToCoord(i);
        const px = (x - 1) * spacing;
        const py = (y - 1) * spacing * (1 + explodeAmount);
        const pz = (z - 1) * spacing;

        // Transparent fill
        const fillMat = new THREE.MeshPhongMaterial({
          color: 0x151a2e,
          transparent: true,
          opacity: 0.08,
          depthWrite: false,
        });
        const mesh = new THREE.Mesh(cellGeo, fillMat);
        mesh.position.set(px, py, pz);
        mesh.userData.cellIndex = i;
        scene.add(mesh);
        cellMeshes.push(mesh);

        // Wireframe edges
        const edgeMat = new THREE.LineBasicMaterial({
          color: 0x2a3055,
          transparent: true,
          opacity: 0.4
        });
        const edges = new THREE.LineSegments(edgeGeo, edgeMat);
        edges.position.copy(mesh.position);
        edges.userData.cellIndex = i;
        scene.add(edges);

        // Glyph placeholder (invisible initially)
        glyphMeshes.push(null);
      }
    }

    function updateCellPositions() {
      const spacing = 1.6;
      for (let i = 0; i < 27; i++) {
        const { x, y, z } = idxToCoord(i);
        const px = (x - 1) * spacing;
        const py = (y - 1) * spacing * (1 + explodeAmount);
        const pz = (z - 1) * spacing;

        cellMeshes[i].position.set(px, py, pz);

        // Update visibility for layer isolation
        if (isolatedLayer === -1) {
          cellMeshes[i].visible = true;
        } else {
          cellMeshes[i].visible = (y === isolatedLayer);
        }

        // Update glyph positions
        if (glyphMeshes[i]) {
          glyphMeshes[i].position.set(px, py, pz);
          glyphMeshes[i].visible = cellMeshes[i].visible;
        }
      }

      // Update edges too
      scene.children.forEach(child => {
        if (child instanceof THREE.LineSegments && child.userData.cellIndex !== undefined) {
          const ci = child.userData.cellIndex;
          child.position.copy(cellMeshes[ci].position);
          child.visible = cellMeshes[ci].visible;
        }
      });
    }

    function updateCellHighlights() {
      scene.children.forEach(child => {
        if (child instanceof THREE.LineSegments && child.userData.cellIndex !== undefined) {
          const ci = child.userData.cellIndex;
          if (ci === hoveredCell && board[ci] === EMPTY) {
            child.material.color.setHex(getPlayerColorHex(currentPlayer));
            child.material.opacity = 0.9;
          } else if (winLine && winLine.includes(ci)) {
            const winner = board[winLine[0]];
            child.material.color.setHex(getPlayerColorHex(winner));
            child.material.opacity = 1.0;
          } else {
            child.material.color.setHex(0x2a3055);
            child.material.opacity = 0.4;
          }
        }
      });

      // Dim non-winning cells when game is won
      cellMeshes.forEach((mesh, i) => {
        if (winLine && !winLine.includes(i)) {
          mesh.material.opacity = 0.02;
        } else if (winLine && winLine.includes(i)) {
          const winner = board[winLine[0]];
          mesh.material.color.setHex(getPlayerColorHex(winner));
          mesh.material.opacity = 0.15;
        } else {
          mesh.material.color.setHex(0x151a2e);
          mesh.material.opacity = 0.08;
        }
      });
    }

    function createGlyph3D(player, position) {
      let glyph;
      if (player === X) {
        // X: crossed bars
        const barGeo = new THREE.BoxGeometry(0.08, 0.8, 0.08);
        const barMat = new THREE.MeshPhongMaterial({
          color: CYAN,
          emissive: CYAN,
          emissiveIntensity: 0.8,
          transparent: true,
          opacity: 0.9,
        });
        glyph = new THREE.Group();
        const bar1 = new THREE.Mesh(barGeo, barMat);
        bar1.rotation.z = Math.PI / 4;
        const bar2 = new THREE.Mesh(barGeo, barMat.clone());
        bar2.rotation.z = -Math.PI / 4;
        glyph.add(bar1, bar2);

        // Add a subtle point light
        const light = new THREE.PointLight(CYAN, 0.4, 3);
        glyph.add(light);
      } else if (player === O) {
        // O: torus ring
        const torusGeo = new THREE.TorusGeometry(0.32, 0.05, 12, 32);
        const torusMat = new THREE.MeshPhongMaterial({
          color: PINK,
          emissive: PINK,
          emissiveIntensity: 0.8,
          transparent: true,
          opacity: 0.9,
        });
        glyph = new THREE.Mesh(torusGeo, torusMat);
        glyph.rotation.x = Math.PI / 2;

        const light = new THREE.PointLight(PINK, 0.4, 3);
        glyph.add(light);
      } else if (player === TRIANGLE) {
        // Triangle: 3D hollow neon triangle prism
        const shape = new THREE.Shape();
        const r = 0.38;
        const sin60 = Math.sin(Math.PI / 3);
        const cos60 = Math.cos(Math.PI / 3);

        // Outer triangle
        shape.moveTo(0, r);
        shape.lineTo(r * sin60, -r * cos60);
        shape.lineTo(-r * sin60, -r * cos60);
        shape.closePath();

        // Inner cutout hole
        const hole = new THREE.Path();
        const ir = 0.23;
        hole.moveTo(0, ir);
        hole.lineTo(-ir * sin60, -ir * cos60);
        hole.lineTo(ir * sin60, -ir * cos60);
        hole.closePath();
        shape.holes.push(hole);

        const extrudeSettings = {
          depth: 0.08,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.015,
          bevelThickness: 0.015
        };
        const triGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        triGeo.center();

        const triMat = new THREE.MeshPhongMaterial({
          color: TRI_COLOR,
          emissive: TRI_COLOR,
          emissiveIntensity: 0.8,
          transparent: true,
          opacity: 0.9,
        });
        glyph = new THREE.Mesh(triGeo, triMat);

        const light = new THREE.PointLight(TRI_COLOR, 0.4, 3);
        glyph.add(light);
      }
      if (glyph) glyph.position.copy(position);
      return glyph;
    }

    function placeGlyph3D(cellIndex) {
      const pos = cellMeshes[cellIndex].position.clone();
      const glyph = createGlyph3D(board[cellIndex], pos);
      glyph.scale.set(0.01, 0.01, 0.01);
      scene.add(glyph);
      glyphMeshes[cellIndex] = glyph;

      // Animate scale in
      const targetScale = 1;
      const animate = () => {
        if (glyph.scale.x < targetScale) {
          glyph.scale.multiplyScalar(1.15);
          if (glyph.scale.x > targetScale) glyph.scale.set(targetScale, targetScale, targetScale);
          requestAnimationFrame(animate);
        }
      };
      animate();
    }

    function updateGhostPreview() {
      if (ghostMesh) {
        scene.remove(ghostMesh);
        ghostMesh = null;
      }
      if (hoveredCell === -1 || board[hoveredCell] !== EMPTY || gameOver) return;

      const pos = cellMeshes[hoveredCell].position.clone();
      ghostMesh = createGlyph3D(currentPlayer, pos);
      ghostMesh.traverse(child => {
        if (child.isMesh) {
          child.material = child.material.clone();
          child.material.opacity = 0.2;
          child.material.emissiveIntensity = 0.3;
        }
        if (child.isLight) child.intensity = 0.1;
      });
      scene.add(ghostMesh);
    }

    function drawWinLine3D(cells) {
      const positions = cells.map(ci => cellMeshes[ci].position);
      const geo = new THREE.BufferGeometry().setFromPoints(positions);
      const winner = board[cells[0]];
      const winColor = getPlayerColorHex(winner);
      const mat = new THREE.LineBasicMaterial({
        color: winColor,
        linewidth: 2,
        transparent: true,
        opacity: 1
      });
      winLineMesh = new THREE.Line(geo, mat);
      scene.add(winLineMesh);

      // Also add a thick glowing tube
      const curve = new THREE.CatmullRomCurve3(positions);
      const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.06, 8, false);
      const tubeMat = new THREE.MeshPhongMaterial({
        color: winColor,
        emissive: winColor,
        emissiveIntensity: 1.5,
        transparent: true,
        opacity: 0.7,
      });
      const tube = new THREE.Mesh(tubeGeo, tubeMat);
      tube.userData.isWinTube = true;
      scene.add(tube);
    }

    function onResize() {
      const rect = document.getElementById('viewport').getBoundingClientRect();
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
      renderer.setSize(rect.width, rect.height);
    }

    function animate() {
      animFrame = requestAnimationFrame(animate);
      controls.update();

      // Rotate glyphs slightly
      glyphMeshes.forEach((g, i) => {
        if (g) {
          if (board[i] === O) g.rotation.z += 0.008;
          if (board[i] === TRIANGLE) g.rotation.y += 0.012;
        }
      });

      // Pulse win tube
      scene.children.forEach(child => {
        if (child.userData && child.userData.isWinTube) {
          const t = Date.now() * 0.003;
          child.material.emissiveIntensity = 1.0 + Math.sin(t) * 0.5;
          child.material.opacity = 0.5 + Math.sin(t) * 0.2;
        }
      });

      if (viewMode === '3d') renderer.render(scene, camera);
    }

    // ═══════════════════════════════════════════════════════════════
    // 2D Flat View
    // ═══════════════════════════════════════════════════════════════

    function buildFlatView() {
      const container = document.getElementById('flat-view');
      container.innerHTML = '';

      const planesContainer = document.createElement('div');
      planesContainer.className = 'flat-planes-container';
      planesContainer.id = 'flatPlanesContainer';

      for (let y = 0; y < 3; y++) {
        const plane = document.createElement('div');
        plane.className = 'flat-plane';
        plane.dataset.layerIndex = y;

        const label = document.createElement('div');
        label.className = 'flat-plane-label';
        label.textContent = `LAYER ${y + 1} ${y === 0 ? '(BOTTOM)' : y === 1 ? '(MID)' : '(TOP)'}`;
        plane.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'flat-grid';

        for (let z = 0; z < 3; z++) {
          for (let x = 0; x < 3; x++) {
            const ci = idx(x, y, z);
            const cell = document.createElement('div');
            cell.className = 'flat-cell';
            cell.dataset.cellIndex = ci;
            cell.dataset.x = x;
            cell.dataset.y = y;
            cell.dataset.z = z;

            cell.addEventListener('click', () => {
              if (board[ci] === EMPTY && !gameOver && !isCurrentPlayerBot()) {
                makeMove(ci);
              }
            });

            cell.addEventListener('mouseenter', () => {
              if (board[ci] === EMPTY && !gameOver) {
                playSound('hover');
                highlightPillar(x, z, y);
                if (!isCurrentPlayerBot()) {
                  const ghostClass = currentPlayer === X ? 'ghost-x' : (currentPlayer === O ? 'ghost-o' : 'ghost-tri');
                  cell.classList.add(ghostClass);
                  cell.textContent = getPlayerSymbol(currentPlayer);
                }
              }
            });

            cell.addEventListener('mouseleave', () => {
              clearPillarHighlights();
              if (board[ci] === EMPTY) {
                cell.classList.remove('ghost-x', 'ghost-o', 'ghost-tri');
                cell.textContent = '';
              }
            });

            grid.appendChild(cell);
          }
        }

        plane.appendChild(grid);
        planesContainer.appendChild(plane);
      }

      container.appendChild(planesContainer);
    }

    function updateFlatView() {
      const cells = document.querySelectorAll('.flat-cell');
      cells.forEach(cell => {
        const ci = parseInt(cell.dataset.cellIndex);
        cell.className = 'flat-cell';
        cell.textContent = '';

        if (board[ci] === X) {
          cell.classList.add('x-cell');
          cell.textContent = '✕';
        } else if (board[ci] === O) {
          cell.classList.add('o-cell');
          cell.textContent = '◯';
        } else if (board[ci] === TRIANGLE) {
          cell.classList.add('tri-cell');
          cell.textContent = '△';
        }

        // Win highlighting
        if (winLine && winLine.includes(ci)) {
          cell.classList.add('winning-cell');
        } else if (winLine) {
          cell.classList.add('dimmed');
        }
      });
    }

    function highlightPillar(x, z, activeY) {
      const cells = document.querySelectorAll('.flat-cell');
      cells.forEach(cell => {
        const cx = parseInt(cell.dataset.x);
        const cz = parseInt(cell.dataset.z);
        const cy = parseInt(cell.dataset.y);
        if (cx === x && cz === z && cy !== activeY) {
          cell.classList.add('pillar-highlight');
        }
      });
    }

    function clearPillarHighlights() {
      document.querySelectorAll('.flat-cell.pillar-highlight').forEach(c => {
        c.classList.remove('pillar-highlight');
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // Game Logic
    // ═══════════════════════════════════════════════════════════════

    function makeMove(cellIndex) {
      if (board[cellIndex] !== EMPTY || gameOver) return;

      board[cellIndex] = currentPlayer;
      moveHistory.push({ player: currentPlayer, cell: cellIndex });

      playSound(currentPlayer === X ? 'moveX' : (currentPlayer === O ? 'moveO' : 'moveTri'));

      // Update 3D
      placeGlyph3D(cellIndex);
      updateCellHighlights();
      updateGhostPreview();

      // Update 2D
      updateFlatView();

      // Check win
      const result = checkWin(board);
      if (result) {
        gameOver = true;
        winLine = result.line;
        const winner = result.winner;

        // Update score
        if (winner === X) scores.x++;
        else if (winner === O) scores.o++;
        else if (winner === TRIANGLE) scores.tri++;
        updateScoreboard();

        // Win visuals
        drawWinLine3D(result.line);
        updateCellHighlights();
        updateFlatView();
        updateStatusDisplay();
        updateLinesChecklist();
        playSound('win');

        setTimeout(() => {
          // Don't auto-reset — let user decide
        }, 1000);
        return;
      }

      if (isBoardFull(board)) {
        gameOver = true;
        scores.draw++;
        updateScoreboard();
        updateStatusDisplay();
        playSound('draw');
        return;
      }

      // Switch player
      if (gameMode === '3p') {
        if (currentPlayer === X) currentPlayer = O;
        else if (currentPlayer === O) currentPlayer = TRIANGLE;
        else currentPlayer = X;
      } else {
        currentPlayer = currentPlayer === X ? O : X;
      }
      updateTurnDisplay();
      updateMoveLog();

      // AI move
      if (isCurrentPlayerBot() && !gameOver) {
        setTimeout(() => {
          const aiMove = getAIMove();
          if (aiMove !== -1) makeMove(aiMove);
        }, 400);
      }
    }

    function resetGame() {
      board = new Array(27).fill(EMPTY);
      currentPlayer = X;
      gameOver = false;
      winLine = null;
      moveHistory = [];
      hoveredCell = -1;

      buildCells();
      updateCellPositions();
      updateFlatView();
      updateTurnDisplay();
      updateStatusDisplay();
      updateMoveLog();
      updateLinesChecklist();

      playSound('draw');

      document.getElementById('historyLog').innerHTML = '';
    }

    // ═══════════════════════════════════════════════════════════════
    // AI Engine
    // ═══════════════════════════════════════════════════════════════

    function getAIMove() {
      const available = [];
      for (let i = 0; i < 27; i++) {
        if (board[i] === EMPTY) available.push(i);
      }
      if (available.length === 0) return -1;

      if (aiDifficulty === 'easy') {
        return available[Math.floor(Math.random() * available.length)];
      }

      if (gameMode === '3p') {
        return threePlayerAI(available, currentPlayer, aiDifficulty);
      }

      if (aiDifficulty === 'medium') {
        return tacticalAI(available);
      }

      return cyberCoreAI(available);
    }

    function threePlayerAI(available, aiPlayer, diff) {
      // 1. Can AI win immediately?
      for (const move of available) {
        board[move] = aiPlayer;
        const win = checkWin(board);
        board[move] = EMPTY;
        if (win) return move;
      }

      // 2. Can any opponent win on their next turn? Block!
      const opponents = [X, O, TRIANGLE].filter(p => p !== aiPlayer);
      for (const opp of opponents) {
        for (const move of available) {
          board[move] = opp;
          const win = checkWin(board);
          board[move] = EMPTY;
          if (win) return move;
        }
      }

      // 3. Medium: take center if free, else random corner/move
      if (diff === 'medium') {
        if (board[13] === EMPTY) return 13;
        const corners = [0, 2, 6, 8, 18, 20, 24, 26].filter(c => board[c] === EMPTY);
        if (corners.length > 0 && Math.random() < 0.75) {
          return corners[Math.floor(Math.random() * corners.length)];
        }
        return available[Math.floor(Math.random() * available.length)];
      }

      // 4. Cyber (Tactical positional scoring):
      let bestScore = -Infinity;
      let bestMove = available[0];
      const corners = new Set([0, 2, 6, 8, 18, 20, 24, 26]);

      for (const move of available) {
        let score = 0;
        if (move === 13) score += 15;
        else if (corners.has(move)) score += 6;

        for (const line of WIN_LINES) {
          if (line.includes(move)) {
            const [a, b, c] = line;
            const vals = [board[a], board[b], board[c]];
            const aiCount = vals.filter(v => v === aiPlayer).length;
            const oppCount = vals.filter(v => v !== EMPTY && v !== aiPlayer).length;

            if (oppCount === 0) {
              if (aiCount === 1) score += 9;
              else if (aiCount === 0) score += 3;
            } else if (aiCount === 0) {
              if (oppCount === 1) score += 4;
            }
          }
        }
        score += Math.random() * 0.6;
        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }
      return bestMove;
    }

    function tacticalAI(available) {
      // 1. Win if possible
      for (const move of available) {
        board[move] = O;
        if (checkWin(board)) { board[move] = EMPTY; return move; }
        board[move] = EMPTY;
      }

      // 2. Block opponent win
      for (const move of available) {
        board[move] = X;
        if (checkWin(board)) { board[move] = EMPTY; return move; }
        board[move] = EMPTY;
      }

      // 3. Center
      if (board[13] === EMPTY) return 13;

      // 4. Random
      return available[Math.floor(Math.random() * available.length)];
    }

    function cyberCoreAI(available) {
      // Minimax with alpha-beta pruning, depth limited
      const MAX_DEPTH = 4;
      let bestScore = -Infinity;
      let bestMove = available[0];

      for (const move of available) {
        board[move] = O;
        const score = minimax(board, 0, false, -Infinity, Infinity, MAX_DEPTH);
        board[move] = EMPTY;
        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }
      return bestMove;
    }

    function minimax(b, depth, isMaximizing, alpha, beta, maxDepth) {
      const result = checkWin(b);
      if (result) {
        return result.winner === O ? (100 - depth) : (-100 + depth);
      }
      if (isBoardFull(b) || depth >= maxDepth) {
        return evaluateBoard(b);
      }

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 27; i++) {
          if (b[i] !== EMPTY) continue;
          b[i] = O;
          const ev = minimax(b, depth + 1, false, alpha, beta, maxDepth);
          b[i] = EMPTY;
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 27; i++) {
          if (b[i] !== EMPTY) continue;
          b[i] = X;
          const ev = minimax(b, depth + 1, true, alpha, beta, maxDepth);
          b[i] = EMPTY;
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function evaluateBoard(b) {
      let score = 0;
      for (const line of WIN_LINES) {
        const [a, bb, c] = line;
        const vals = [b[a], b[bb], b[c]];
        const oCount = vals.filter(v => v === O).length;
        const xCount = vals.filter(v => v === X).length;

        if (oCount > 0 && xCount === 0) {
          score += oCount === 2 ? 10 : 1;
        }
        if (xCount > 0 && oCount === 0) {
          score -= xCount === 2 ? 10 : 1;
        }
      }
      // Center bonus
      if (b[13] === O) score += 5;
      if (b[13] === X) score -= 5;
      return score;
    }

    // ═══════════════════════════════════════════════════════════════
    // Audio — Web Audio API Synthesis
    // ═══════════════════════════════════════════════════════════════

    let audioCtx;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        if (type === 'hover') {
          // Short high pip
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(2000, now);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }

        if (type === 'moveX') {
          // Higher chime — two quick notes
          [1200, 1600].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.12, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.15);
          });
        }

        if (type === 'moveO') {
          // Resonant saw wave
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(280, now + 0.15);
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }

        if (type === 'moveTri') {
          // Resonant crystal pulse - two quick harmonics
          [880, 1320].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.12, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.18);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.18);
          });
        }

        if (type === 'win') {
          // Ascending arpeggio
          const notes = [523, 659, 784, 1047, 1319];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const dist = ctx.createWaveShaper();

            // Distortion curve
            const curve = new Float32Array(256);
            for (let j = 0; j < 256; j++) {
              const x = (j * 2) / 256 - 1;
              curve[j] = (Math.PI + 4) * x / (Math.PI + 4 * Math.abs(x));
            }
            dist.curve = curve;

            osc.connect(dist);
            dist.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            osc.type = i % 2 === 0 ? 'square' : 'triangle';
            gain.gain.setValueAtTime(0.1, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.4);
          });
        }

        if (type === 'draw') {
          // Low bass slide down
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {
        // Audio context may not be available
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').textContent = audioEnabled ? '🔊' : '🔇';
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const btn = document.getElementById('hamburgerBtn');
      const isOpen = sidebar.classList.contains('open');

      if (isOpen) {
        sidebar.classList.remove('open');
        btn.classList.remove('open');
        overlay.classList.remove('visible');
        setTimeout(() => overlay.classList.remove('open'), 300);
      } else {
        overlay.classList.add('open');
        requestAnimationFrame(() => {
          overlay.classList.add('visible');
          sidebar.classList.add('open');
          btn.classList.add('open');
        });
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // UI Updates
    // ═══════════════════════════════════════════════════════════════

    function updateTurnDisplay() {
      const el = document.getElementById('turnIndicator');
      const text = document.getElementById('turnText');
      el.className = 'turn-indicator ' + (currentPlayer === X ? 'x-turn' : (currentPlayer === O ? 'o-turn' : 'tri-turn'));
      let label = 'PLAYER X';
      if (currentPlayer === O) {
        label = (gameMode === 'ai' ? 'AI [O]' : (gameMode === '3p' && botMode3P === '2' ? 'BOT [O]' : 'PLAYER O'));
      } else if (currentPlayer === TRIANGLE) {
        label = (gameMode === '3p' && (botMode3P === '1' || botMode3P === '2') ? 'BOT [△]' : 'PLAYER △');
      }
      text.textContent = label;
    }

    function updateStatusDisplay() {
      const badge = document.getElementById('statusBadge');
      if (gameOver) {
        if (winLine) {
          const winner = board[winLine[0]];
          let winClass = 'win-x';
          let winText = '✕ WINS';
          if (winner === O) {
